<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142031">
  <title>Prompt Mirror — 오프라인</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #142031; background: #f7f2e8; }
    main { width: min(100%, 480px); padding: 28px; border: 1px solid #142031; background: #fffdf7; box-shadow: 8px 8px 0 #9c322e; }
    small { color: #9c322e; font-weight: 700; letter-spacing: .1em; }
    h1 { margin: 14px 0 10px; font-family: Georgia, "Noto Serif KR", serif; font-size: clamp(28px, 8vw, 42px); line-height: 1.1; }
    p { color: #56616b; line-height: 1.7; }
    button { margin-top: 12px; padding: 10px 14px; border: 1px solid #142031; color: #fffdf7; background: #142031; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <small>OFFLINE MODE</small>
    <h1>연결이 잠시<br>끊겼습니다.</h1>
    <p>이미 설치하거나 방문한 Prompt Mirror는 인터넷 없이도 다시 열 수 있습니다. 네트워크가 돌아오면 최신 버전으로 자동 갱신됩니다.</p>
    <button type="button" onclick="location.reload()">다시 연결하기</button>
  </main>
</body>
</html>
